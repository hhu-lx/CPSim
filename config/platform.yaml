# Implementation note.
simulation:
  time_unit: seconds
  start_datetime: "2026-09-22T16:00:00"
  duration_hours: 24
  step_seconds: 30                   # Implementation note.
  stats_interval_seconds: 60         # Implementation note.
  renewable_optimization_interval_seconds: 900  # Implementation note.
  report_interval_seconds: 300       # Implementation note.
  cpf_interval_seconds: 900          # Implementation note.
  power_flow_interval_seconds: 900   # Implementation note.
  time_scale: 0.0166667              # Implementation note.

reports:
  directory: reports

synthetic_data:
  seed: 42

reference_tables:
  equipment_power_curves: config/reference/equipment_power_curves.csv
  equipment_power_timeseries: config/reference/equipment_power_timeseries.csv

storages:
  - id: storage-1
    bus_id: 10
    # Implementation note.
    # Implementation note.
    capacity_mwh: 174.0
    max_power_mw: 87.0
    initial_soc_mwh: 87.0
    # Keep 30% of the 174 MWh capacity as emergency reserve.
    min_soc_mwh: 52.2
    charge_efficiency: 0.95
    discharge_efficiency: 0.95
    degradation_cost_per_mwh: 2.0

storage_control:
  deadband_mw: 12                 # Implementation note.
  reference_alpha: 0.02            # Implementation note.
  optimization_interval_seconds: 60 # Implementation note.

optimization:
  enabled: true
  # Implementation note.
  mode: none
  objective: min_cost
  # Implementation note.
  load_balance_weight: 2.0
  # Implementation note.
  minimum_active_center_tasks: 1
  # Implementation note.
  task_batch_interval_seconds: 300
  # Implementation note.
  global_time_limit_seconds: 2.0
  global_relative_mip_gap: 0.03
  # Implementation note.
  forecast_horizon_hours: 2.0
  forecast_step_minutes: 5.0
  # Implementation note.
  # objective_function: my_objectives:score
  weights:
    cost: 1.0
    carbon: 1.5
    delay: 0.2
    peak_shaving: 3.0
    renewable_curtailment: 1.0
    storage_degradation: 0.5

scheduling:
  batch_interval_seconds: 5          # Implementation note.
  max_tasks_per_batch: 128           # Implementation note.
  local_max_tasks_per_batch: 4       # Implementation note.

electricity_pricing:
  # Implementation note.
  file: config/time_of_use_pricing.csv
  mode: marginal


# Implementation note.
tasks:
  excel_file: config/task_data_completed.csv       # Implementation note.
  default_region: region_a              # Implementation note.
